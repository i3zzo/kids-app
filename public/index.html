<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Buddy</title>
  <link rel="stylesheet" href="/styles.css">
  <link rel="icon" href="/buddy.svg" type="image/svg+xml">
</head>
<body>
  <header class="top">
    <img src="/buddy.svg" alt="" class="logo" width="56" height="56">
    <h1 data-i18n="title"></h1>
    <button id="lang-toggle" class="lang" type="button"></button>
  </header>

  <main>
    <p class="intro" data-i18n="intro"></p>

    <div class="modes" role="tablist">
      <button type="button" class="mode active" data-mode="story" role="tab" aria-selected="true">
        <span class="emoji" aria-hidden="true">📖</span><span data-i18n="modeStory"></span>
      </button>
      <button type="button" class="mode" data-mode="question" role="tab" aria-selected="false">
        <span class="emoji" aria-hidden="true">❓</span><span data-i18n="modeQuestion"></span>
      </button>
    </div>

    <form id="ask-form">
      <label for="message" class="sr-only" data-i18n="placeholderStory"></label>
      <textarea id="message" maxlength="500" rows="3" required></textarea>
      <div class="row">
        <span id="count" class="count">0/500</span>
        <button type="submit" id="send" data-i18n="send"></button>
      </div>
    </form>

    <section id="answer" class="answer" aria-live="polite" hidden></section>

    <p class="note" data-i18n="safetyNote"></p>
  </main>

  <script src="/app.js" type="module"></script>
</body>
</html>
